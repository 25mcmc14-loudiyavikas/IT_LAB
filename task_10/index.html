<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom jQuery Tabs</title>
    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="jquery.tabs.js"></script>
</head>
<body>

<div class="container">
    <h1>My Custom Tab Navigation</h1>

    <div id="myTabs" class="tabs">
        <ul class="tab-nav">
            <li data-tab="home">Home</li>
            <li data-tab="about">About</li>
            <li data-tab="contact">Contact</li>
        </ul>

        <div class="tab-content">
            <div id="home" class="tab-panel">
                <h2>Home</h2>
                <p>Welcome to our modern tab navigation plugin demo.</p>
            </div>

            <div id="about" class="tab-panel">
                <h2>About</h2>
                <p>This plugin supports animations, keyboard navigation and URL hash bookmarking.</p>
            </div>

            <div id="contact" class="tab-panel">
                <h2>Contact</h2>
                <p>Email: example@email.com</p>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function(){
        $("#myTabs").customTabs({
            activeClass: "active-tab",
            animationSpeed: 400,
            defaultTab: "home"
        });
    });
</script>

</body>
</html>
