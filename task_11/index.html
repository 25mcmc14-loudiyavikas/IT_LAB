<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Advanced jQuery Events & Animations</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</head>
<body>

<div class="container">
    <h1>Product Showcase</h1>

    <div class="controls">
        <button id="toggleView">Switch to Grid View</button>
        <button id="addItem">Add New Product</button>
    </div>

    <ul id="productList" class="list-view">

        <li class="product">
            <h3>Product 1</h3>
            <button class="details-btn">Details</button>
            <div class="details">
                <p>This is Product 1 description with price and features.</p>
            </div>
        </li>

        <li class="product">
            <h3>Product 2</h3>
            <button class="details-btn">Details</button>
            <div class="details">
                <p>This is Product 2 description with price and features.</p>
            </div>
        </li>

        <li class="product">
            <h3>Product 3</h3>
            <button class="details-btn">Details</button>
            <div class="details">
                <p>This is Product 3 description with price and features.</p>
            </div>
        </li>

    </ul>
</div>

</body>
</html>
