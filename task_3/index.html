<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Gallery</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="header">
        <h1>Product Gallery</h1>
    </header>

    <main class="main-content">
        <section class="gallery">
            <div class="product-card">
                <div class="image-container">
                    <img src="itachi.jpg" alt="ITACHI" />
                    <div class="overlay">View Details</div>
                </div>
                <h2 class="product-title">ITACHI</h2>
                <p class="product-description">
                    This is a description of ITACHI.
                </p>
            </div>
            <div class="product-card">
                <div class="image-container">
                    <img src="kakashi.jpg" alt="KAKASHI" />
                    <div class="overlay">View Details</div>
                </div>
                <h2 class="product-title">KAKASHI</h2>
                <p class="product-description">
                    This is a description of KAKASHI.
                </p>
            </div>
            <div class="product-card">
                <div class="image-container">
                    <img src="moon.jpg" alt="MOON" />
                    <div class="overlay">View Details</div>
                </div>
                <h2 class="product-title">MOON</h2>
                <p class="product-description">
                    This is a description of MOON.
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2024 My Store. All rights reserved.</p>
    </footer>
</body>
</html>
